version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slow-station-calendar
    ports:
      # 季节年历（前端 + API 同一端口）
      - "8090:8090"
    restart: unless-stopped
    volumes:
      # 开发模式：挂载源码，修改后重启容器生效
      - ./:/app
    environment:
      - TZ=Asia/Shanghai
      - PORT=8090
      # SQLite 持久化到挂载目录
      - CALENDAR_DB=/app/data/calendar.db
    networks:
      - smartlearn-network

networks:
  smartlearn-network:
    driver: bridge
