version: '3.8'

services:
  # 静态站点（原 nginx 方式，仅前端页面）
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    restart: unless-stopped

  # 季节年历全栈服务（API + 静态站点，推荐入口）
  calendar:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - calendar-data:/data          # SQLite 数据持久化
    restart: unless-stopped

volumes:
  calendar-data:
